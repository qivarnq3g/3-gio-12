name: admin

on:
  pull_request:
    paths:
      - "admin/**"
      - "docs/api/openapi.yaml"
      - ".github/workflows/admin.yml"
  push:
    branches: [main]
    paths:
      - "admin/**"
      - "docs/api/openapi.yaml"
      - ".github/workflows/admin.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
